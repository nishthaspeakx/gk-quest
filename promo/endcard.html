<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GK Quest — End Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; }
  .stage{
    position:relative; width:100vw; height:100vh; overflow:hidden;
    font-family:'Fredoka',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.6vh;
    background:
      radial-gradient(110% 55% at 50% -8%, #a855f7 0%, transparent 60%),
      radial-gradient(120% 75% at 118% 112%, #fb923c 0%, transparent 52%),
      radial-gradient(120% 75% at -18% 112%, #22d3ee 0%, transparent 52%),
      linear-gradient(160deg,#6d28d9 0%, #7c3aed 45%, #6366f1 100%);
  }
  .confetti{ position:absolute; inset:0; pointer-events:none; z-index:1; }
  .c{ position:absolute; }
  .glow{
    position:absolute; z-index:0; width:70vh; height:70vh; border-radius:50%;
    background:radial-gradient(circle,#facc1580 0%, #ffffff00 60%); filter:blur(4px);
    top:8%; left:50%; transform:translateX(-50%);
  }
  /* phone */
  .phone{
    position:relative; z-index:2; height:56vh; aspect-ratio:9/17.5;
    background:#0f172a; border-radius:6.5vh; padding:1vh;
    box-shadow:0 3vh 6vh -2vh rgba(15,10,50,.7),
               inset 0 0 0 2px rgba(255,255,255,.16),
               0 0 7vh 1vh rgba(250,204,21,.28);
    transform:rotate(-4deg);
  }
  .screen{
    width:100%; height:100%; border-radius:5.2vh; overflow:hidden;
    background:linear-gradient(172deg,#7c3aed 0%,#6366f1 100%);
    color:#fff; display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:7% 8%;
  }
  .owl{ font-size:6.4vh; line-height:1; margin-top:5%; filter:drop-shadow(0 4px 8px rgba(0,0,0,.25)); }
  .hi{ font-family:'Baloo 2'; font-weight:800; font-size:3.4vh; margin-top:3%; }
  .sub{ font-size:1.55vh; opacity:.94; margin-top:3%; line-height:1.28; }
  .sub b{ color:#facc15; }
  .bullets{
    width:100%; margin-top:5%; background:rgba(255,255,255,.16); border-radius:1.6vh;
    padding:4.5% 6%; text-align:left; display:flex; flex-direction:column; gap:3.5%;
  }
  .bullets div{ font-size:1.5vh; line-height:1.15; }
  .cta{
    margin-top:auto; width:100%; background:#facc15; color:#1f2937; font-family:'Baloo 2';
    font-weight:800; font-size:2.1vh; border-radius:1.9vh; padding:4.5% 0; box-shadow:0 0.7vh 0 0 #eab308;
  }
  /* tagline */
  .tagline{ position:relative; z-index:2; text-align:center; padding:0 6vw; }
  .tagline .l{ font-family:'Baloo 2'; font-weight:800; color:#fff; line-height:1.1; font-size:4.6vh; text-shadow:0 0.4vh 1.6vh rgba(0,0,0,.3); }
  .tagline .l span{ display:block; }
  .l .y{ color:#facc15; }
  .logo{
    position:relative; z-index:2; display:inline-flex; align-items:center; gap:.4em;
    font-family:'Baloo 2'; font-weight:800; color:#fff; font-size:2.7vh;
    background:rgba(255,255,255,.15); padding:.5em 1.15em; border-radius:999px; box-shadow:0 0.7vh 0 rgba(0,0,0,.14);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="confetti" id="cf"></div>

    <div class="phone">
      <div class="screen">
        <div class="owl">🦉</div>
        <div class="hi">Hi! I'm Gyaan</div>
        <div class="sub">Welcome to <b>GK Quest</b> — your 90-day knowledge adventure!</div>
        <div class="bullets">
          <div>🗓️ One fun quest every day</div>
          <div>⭐ Earn stars, coins &amp; badges</div>
          <div>👑 Rookie → Grandmaster</div>
          <div>💡 A new fact every answer</div>
        </div>
        <div class="cta">Start the Adventure ▶</div>
      </div>
    </div>

    <div class="tagline">
      <div class="l"><span>Learn GK.</span><span>Play Smart.</span><span class="y">Become Extraordinary.</span></div>
    </div>

    <div class="logo">🦉 GK Quest</div>
  </div>

  <script>
    const cf = document.getElementById('cf');
    const cols = ['#facc15','#fb7185','#22d3ee','#34d399','#a78bfa','#fb923c','#ffffff'];
    let html='';
    for(let i=0;i<64;i++){
      const x=Math.random()*100, y=Math.random()*100, w=6+Math.random()*9, h=8+Math.random()*13;
      const r=Math.random()*360, col=cols[i%cols.length], round=Math.random()>.6?'50%':'2px';
      html+=`<span class="c" style="left:${x}%;top:${y}%;width:${w}px;height:${h}px;background:${col};transform:rotate(${r}deg);border-radius:${round};opacity:.9"></span>`;
    }
    cf.innerHTML=html;
  </script>
</body>
</html>
