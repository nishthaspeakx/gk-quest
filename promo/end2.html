<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GK Quest — End Screen</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}
  .stage{position:relative;width:100vw;height:100vh;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(110% 55% at 50% -8%, #a855f7 0%, transparent 60%),
      radial-gradient(120% 75% at 118% 112%, #fb923c 0%, transparent 52%),
      radial-gradient(120% 75% at -18% 112%, #22d3ee 0%, transparent 52%),
      linear-gradient(160deg,#6d28d9 0%, #7c3aed 45%, #6366f1 100%);}
  .phone{position:relative;height:92vh;aspect-ratio:9/19.5;
    background:#0f172a;border-radius:5vh;padding:.9vh;
    box-shadow:0 3vh 6vh -2vh rgba(15,10,50,.72), inset 0 0 0 2px rgba(255,255,255,.16), 0 0 7vh 1vh rgba(250,204,21,.28);
    animation:zoom 2.2s ease-out both;transform-origin:center}
  .screen{width:100%;height:100%;border-radius:4.2vh;overflow:hidden;background:#6d28d9}
  .screen img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  @keyframes zoom{from{transform:scale(1.0)}to{transform:scale(1.06)}}
</style>
</head>
<body>
  <div class="stage">
    <div class="phone"><div class="screen">
      <img src="image2.jpeg" alt="GK Quest app screen" />
    </div></div>
  </div>
</body>
</html>
