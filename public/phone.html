<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GK Quest — iPhone 17</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Segoe UI,Roboto,sans-serif}
  .stage{
    min-height:100%;display:flex;align-items:center;justify-content:center;gap:5vw;flex-wrap:wrap;
    padding:24px;overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, #a855f7 0%, transparent 55%),
      radial-gradient(120% 90% at 115% 115%, #fb923c 0%, transparent 48%),
      radial-gradient(120% 90% at -15% 115%, #22d3ee 0%, transparent 48%),
      linear-gradient(160deg,#6d28d9 0%, #4f46e5 45%, #312e81 100%);
  }
  .caption{color:#fff;max-width:300px}
  .caption h1{font-weight:800;font-size:34px;line-height:1.1;margin-bottom:10px}
  .caption p{opacity:.9;font-size:16px;line-height:1.5;margin-bottom:8px}
  .caption .pill{display:inline-block;margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;word-break:break-all}

  /* ---------- iPhone 17 ---------- */
  .phone{
    position:relative;height:min(90vh,880px);aspect-ratio:9/19.5;
    border-radius:64px;padding:11px;
    background:linear-gradient(150deg,#3a3a3c 0%,#1c1c1e 35%,#2c2c2e 70%,#0a0a0b 100%); /* titanium */
    box-shadow:
      0 40px 80px -20px rgba(10,5,40,.7),
      inset 0 0 0 2px rgba(255,255,255,.12),
      inset 0 0 3px 2px rgba(0,0,0,.6);
  }
  /* subtle titanium rail highlight */
  .phone::before{content:"";position:absolute;inset:3px;border-radius:60px;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.10);pointer-events:none;z-index:5}

  .screen{position:relative;width:100%;height:100%;border-radius:53px;overflow:hidden;background:#000;z-index:1}
  iframe{position:absolute;top:44px;left:0;width:100%;height:calc(100% - 44px);border:0;background:#f5f3ff;display:block}

  /* status bar */
  .statusbar{position:absolute;top:0;left:0;right:0;height:44px;z-index:3;color:#fff;
    display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;
    font-size:15px;font-weight:600;letter-spacing:.2px;background:#0b0b0d}
  .statusbar .icons{display:flex;align-items:center;gap:6px}
  .statusbar svg{display:block}

  /* Dynamic Island */
  .island{position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:33%;max-width:124px;height:33px;background:#000;border-radius:20px;z-index:6;
    box-shadow:0 1px 2px rgba(0,0,0,.6), inset 0 0 2px rgba(255,255,255,.05)}
  .island::after{content:"";position:absolute;right:14px;top:50%;transform:translateY(-50%);
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#1e3a5f,#050a12);box-shadow:inset 0 0 2px #0af3}

  /* home indicator */
  .home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
    width:36%;height:5px;border-radius:3px;background:rgba(255,255,255,.7);z-index:6}

  /* screen gloss */
  .gloss{position:absolute;inset:0;border-radius:53px;pointer-events:none;z-index:4;
    background:linear-gradient(125deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 30%)}

  /* side buttons */
  .btn{position:absolute;background:linear-gradient(90deg,#48484a,#242426);border-radius:3px;z-index:0}
  .b-action{left:-3px;top:150px;width:4px;height:34px}         /* Action button */
  .b-volup{left:-3px;top:205px;width:4px;height:56px}
  .b-voldn{left:-3px;top:275px;width:4px;height:56px}
  .b-power{right:-3px;top:225px;width:4px;height:86px}

  @media (max-width:820px){ .caption{display:none} }
</style>
</head>
<body>
  <div class="stage">
    <div class="caption">
      <h1>GK Quest 🦉</h1>
      <p>Your 90-day General Knowledge adventure — running live on iPhone 17.</p>
      <p>Tap right into it and play. It installs offline on any phone too.</p>
      <span class="pill">nishthaspeakx.github.io/gk-quest</span>
    </div>

    <div class="phone">
      <span class="btn b-action"></span>
      <span class="btn b-volup"></span>
      <span class="btn b-voldn"></span>
      <span class="btn b-power"></span>

      <div class="screen">
        <div class="statusbar">
          <span class="time">9:41</span>
          <span class="icons">
            <!-- cellular -->
            <svg width="19" height="12" viewBox="0 0 19 12"><g fill="#fff">
              <rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/>
              <rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/>
            </g></svg>
            <!-- wifi -->
            <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff">
              <path d="M8.5 2.2c2.7 0 5.2 1 7 2.8l-1.4 1.5A7.7 7.7 0 0 0 8.5 4.3 7.7 7.7 0 0 0 2.9 6.5L1.5 5C3.3 3.2 5.8 2.2 8.5 2.2z"/>
              <path d="M8.5 5.6c1.6 0 3.1.6 4.2 1.7l-1.5 1.5A3.9 3.9 0 0 0 8.5 7.7c-1 0-2 .4-2.7 1.1L4.3 7.3A5.9 5.9 0 0 1 8.5 5.6z"/>
              <circle cx="8.5" cy="10.4" r="1.4"/>
            </svg>
            <!-- battery -->
            <svg width="27" height="13" viewBox="0 0 27 13">
              <rect x="0.5" y="0.5" width="22" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".5"/>
              <rect x="2.5" y="2.5" width="16" height="8" rx="1.5" fill="#fff"/>
              <rect x="24" y="4" width="2" height="5" rx="1" fill="#fff" fill-opacity=".5"/>
            </svg>
          </span>
        </div>

        <div class="island"></div>

        <iframe
          src="./"
          title="GK Quest live app"
          allow="autoplay; fullscreen"
          referrerpolicy="no-referrer"></iframe>

        <div class="gloss"></div>
        <div class="home"></div>
      </div>
    </div>
  </div>
</body>
</html>
