name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow this workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Build for the /gk-quest/ sub-path that GitHub Pages serves from
      - run: npm run build
        env:
          PAGES_BASE: /gk-quest/

      # SPA fallback: Pages serves 404.html for unknown paths; a copy of
      # index.html lets client routes (e.g. /quest/1) load on refresh/deep-link.
      - run: cp dist/index.html dist/404.html

      # Tell Jekyll to leave the build alone
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
